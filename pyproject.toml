[project]
name = "hermes-evals"
version = "0.1.0"
description = "Trajectory evaluator for Hermes agents: run golden tasks, grade what the agent did, report pass rates with confidence intervals."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6,<7"]

[project.scripts]
hermes-evals = "hermes_evals.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_evals"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
